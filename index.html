<style>
/* Layout: coluna única de leitura (~720px), barra fixa no topo; dois modos (profissional, paciente) roteados por #hash. */

  --accent:#0E6A87; --accent-ink:#FFFFFF; --accent-soft:#E0EFF4;
  --warn:#9A5700; --warn-soft:#FCF1DF; --crit:#A8261D; --good:#2D7A4E;

  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D161B; --surface:#14212A; --ink:#E5EDF0; --muted:#9BB0B8; --line:#273843;
  --accent:#5DB6D3; --accent-ink:#06222C; --accent-soft:#123241;
  --warn:#E7AE5C; --warn-soft:#33260F; --crit:#F08C82; --good:#6CC495; --dot-off:#2A3B45; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#14212A; --ink:#E5EDF0; --muted:#9BB0B8; --line:#273843;
  --accent:#5DB6D3; --accent-ink:#06222C; --accent-soft:#123241;
  --warn:#E7AE5C; --warn-soft:#33260F; --crit:#F08C82; --good:#6CC495; --dot-off:#2A3B45; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:700;letter-spacing:-.01em}

p{margin:0}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;

@media (max-width:420px){.dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}}
details summary{cursor:pointer;color:var(--accent);font-weight:700}

.stat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}

.vals{display:grid;gap:14px}

<script>
/* ===================== CONFIGURAÇÃO (editar antes de publicar) ===================== */
const CONFIG = {
  servico: "Serviço de Andrologia e Preservação da Fertilidade",
  responsavel: "Dr. Bruno Hállan, urologista e andrologista (CRM-CE 16919, RQE 13791)",
  cidade: "Fortaleza, CE",
  whatsapp: "5585900000000",          // EXEMPLO: trocar pelo número real (DDI+DDD+número)
  appUrl: "https://brunomeneses22.github.io/Preservar-Fertilidade-Masculina/", // endereço público (GitHub Pages)
  versao: "0.1 (rascunho)",
  data: "28 de outubro de 2026",
  revisao: "Revisão anual (próxima: outubro de 2027) ou antes, se sair nova diretriz.",
  financiamento: "A DEFINIR: declarar aqui quem financia o desenvolvimento e a hospedagem.",
  rascunho: true
};
const WHATSAPP_EXEMPLO = CONFIG.whatsapp === "5585900000000";

/* ===================== Dados da triagem ===================== */
const TRAT = [
  {id:"alq", nivel:3, t:"Quimioterapia com agente alquilante", s:"ciclofosfamida, ifosfamida, procarbazina, bussulfano, melfalano, clorambucil"},
  {id:"tmo", nivel:3, t:"Transplante de medula óssea", s:"condicionamento em alta dose"},
  {id:"rt",  nivel:3, t:"Radioterapia com testículos no campo ou próximos", s:"pélvica, testicular ou corporal total"},
  {id:"plat",nivel:2, t:"Quimioterapia com platina", s:"cisplatina, carboplatina"},
  {id:"outq",nivel:1, t:"Outra quimioterapia", s:"ex.: antraciclinas, vincristina, metotrexato, bleomicina"},
  {id:"cir", nivel:2, t:"Cirurgia pélvica ou retroperitoneal", s:"risco para a ejaculação"},
  {id:"orq", nivel:2, t:"Orquiectomia", s:"retirada de testículo"},
  {id:"alvo",nivel:0, t:"Imunoterapia, terapia-alvo ou hormonioterapia", s:"efeito na fertilidade pouco conhecido"},
  {id:"nd",  nivel:0, t:"Tratamento ainda não definido", s:""}
];
const URG = [
  {id:"1", t:"Em até 3 dias"}, {id:"2", t:"Em 4 a 7 dias"}, {id:"3", t:"Em 8 a 14 dias"},
  {id:"4", t:"Em mais de 14 dias"}, {id:"0", t:"Já começou"}
];

/* ===================== Utilidades ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ===================== Código de encaminhamento (stateless) =====================
   O código carrega as respostas da triagem; nada é guardado em servidor.
   40 bits de dados em 8 caracteres Crockford base32 + 1 caractere de conferência:
   versão (3 bits) · puberdade (2) · tratamentos (9, um por opção) · início (3)
   · interesse (2) · dia da triagem (10, dias desde 01/01/2026, ciclo de 1024 dias)
   · parte aleatória (11, para que casos iguais gerem códigos diferentes).
   É uma codificação, não uma criptografia: quem tiver o código consegue ler as respostas,
   que não identificam o paciente. Mudar a ordem de TRAT, URG ou dos campos exige nova VERSAO_COD. */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const VERSAO_COD = 1;
const COD_PUB = ["s","n","x"];
const COD_URG = ["1","2","3","4","0","?"];          // "?" = não informado (código gerado pelo paciente)
const COD_INT = ["s","i","n","p"];                  // "p" = gerado pelo próprio paciente, sem triagem
const COD_BASES = [8, 4, 512, 8, 4, 1024, 2048];    // produto = 2^40
const DIA0 = Date.UTC(2026, 0, 1);
const RE_COD = /^OF-[0-9A-Z]{3}-[0-9A-Z]{3}-[0-9A-Z]{3}$/;
function diaHoje(){ const n = new Date(); return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - DIA0) / 864e5); }
/* Soma ponderada módulo 31 (primo): pega erros de um caractere e trocas de vizinhos (exceto 0↔Z) */
function conferencia(vals){ return vals.reduce((s, v, i) => s + v * (i + 1), 0) % 31; }
function codificar(d){
  const mask = TRAT.reduce((m, o, i) => m + (d.trat.includes(o.id) ? 2 ** i : 0), 0);
  const aleat = crypto.getRandomValues(new Uint32Array(1))[0] % 2048;
  const campos = [VERSAO_COD, COD_PUB.indexOf(d.pub), mask, COD_URG.indexOf(d.urg), COD_INT.indexOf(d.int), ((diaHoje() % 1024) + 1024) % 1024, aleat];
  if (campos.some(v => v < 0)) throw new Error("Resposta fora do esperado ao gerar o código.");
  let n = 0; campos.forEach((v, i) => { n = n * COD_BASES[i] + v; });   // até 2^40, seguro em Number
  const vals = []; for (let i = 0; i < 8; i++){ vals.unshift(n % 32); n = Math.floor(n / 32); }
  vals.push(conferencia(vals));
  const c = vals.map(v => B32[v]).join("");
  return `OF-${c.slice(0,3)}-${c.slice(3,6)}-${c.slice(6)}`;
}
function decodificar(bruto){
  let s = String(bruto || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (s.startsWith("OF")) s = s.slice(2);
  s = s.replace(/O/g, "0").replace(/[IL]/g, "1");
  if (s.length !== 9) return {erro: "O código tem 9 caracteres depois de OF, por exemplo OF-1A2-B3C-D4E."};
  const vals = [...s].map(ch => B32.indexOf(ch));
  if (vals.some(v => v < 0)) return {erro: "O código tem um caractere que não existe neste formato. Confira se foi copiado sem erros."};
  if (conferencia(vals.slice(0, 8)) !== vals[8]) return {erro: "O código não confere. Provavelmente um caractere foi digitado errado."};
  let n = 0; for (let i = 0; i < 8; i++) n = n * 32 + vals[i];
  const out = []; for (let i = COD_BASES.length - 1; i >= 0; i--){ out.unshift(n % COD_BASES[i]); n = Math.floor(n / COD_BASES[i]); }
  const [ver, pub, mask, urg, int, dia] = out;
  if (ver !== VERSAO_COD) return {erro: "Este código foi gerado por outra versão do app."};
  if (!COD_PUB[pub] || !COD_URG[urg]) return {erro: "O código não confere. Provavelmente um caractere foi digitado errado."};
  const hoje = diaHoje(), k = hoje - (((hoje - dia) % 1024) + 1024) % 1024;
  const c = vals.map(v => B32[v]).join("");
  return {
    codigo: `OF-${c.slice(0,3)}-${c.slice(3,6)}-${c.slice(6)}`,
    pub: COD_PUB[pub], trat: TRAT.filter((o, i) => mask & (1 << i)).map(o => o.id),
    urg: COD_URG[urg], int: COD_INT[int], data: new Date(DIA0 + k * 864e5)
  };
}
function nivelRisco(trat){
  const sel = TRAT.filter(o => trat.includes(o.id));
  const max = sel.length ? Math.max(...sel.map(o => o.nivel)) : -1;
  return max >= 3 ? ["alto","Risco alto"] : max === 2 ? ["inter","Risco intermediário"] : max === 1 ? ["baixo","Risco baixo a intermediário"] : ["incerto","Risco incerto"];
}
const dataFmt = (dt, dias = 0) => { const x = new Date(dt.getTime() + dias * 864e5); return `${String(x.getUTCDate()).padStart(2,"0")}/${String(x.getUTCMonth()+1).padStart(2,"0")}/${x.getUTCFullYear()}`; };
const URG_DIAS = {"1":3, "2":7, "3":14};
const TXT_PUB = {s:"Sim, pós-púbere", n:"Não (pré-púbere)", x:"Não sabe"};
const TXT_INT = {s:"Quer conversar sobre fertilidade", i:"Está indeciso", n:"Não quer conversar neste momento", p:"Código gerado pelo próprio paciente, sem triagem"};
/* Lista legível do que o código informa; usada na tela do serviço e na do paciente */
function resumoCodigo(r){
  if (r.int === "p") return [["Origem", "Gerado pelo próprio paciente no guia, sem triagem profissional"], ["Data", dataFmt(r.data)]];
  const u = URG.find(o => o.id === r.urg);
  const prazo = URG_DIAS[r.urg] ? ` (até ${dataFmt(r.data, URG_DIAS[r.urg])})` : "";
  return [
    ["Data da triagem", dataFmt(r.data)],
    ["Pós-púbere", TXT_PUB[r.pub]],
    ["Tratamento planejado", TRAT.filter(o => r.trat.includes(o.id)).map(o => o.t).join("; ")],
    ["Início do tratamento", (u ? u.t : "Não informado") + prazo],
    ["Interesse", TXT_INT[r.int]],
    ["Classificação", nivelRisco(r.trat)[1]]
  ];
}
const tabelaResumo = linhas => `<dl class="dl">${linhas.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;

function baseUrl(){ return CONFIG.appUrl || (location.origin + location.pathname); }
function linkPaciente(code){ return `${baseUrl()}#pda-${code}`; }
function linkServico(code){ return `${baseUrl()}#ler-${code}`; }
function linkWhats(code){
  const r = decodificar(code);
  let prazo = "";
  if (!r.erro){
    if (URG_DIAS[r.urg]) prazo = ` Meu tratamento está previsto para começar até ${dataFmt(r.data, URG_DIAS[r.urg])}.`;
    else if (r.urg === "4") prazo = ` Meu tratamento está previsto para começar depois de ${dataFmt(r.data, 14)}.`;
    else if (r.urg === "0") prazo = " Meu tratamento já começou.";
  }
  const msg = `Olá! A equipe que cuida do meu tratamento me orientou a procurar avaliação de preservação da fertilidade. Meu código é ${code}.${prazo}`;
  return {url:`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`, msg};
}
function numeroFmt(n){ const m = n.match(/^55(\d{2})(\d{4,5})(\d{4})$/); return m ? `+55 (${m[1]}) ${m[2]}-${m[3]}` : "+" + n; }
async function copiar(texto, toastEl, alvoSel){
  try { await navigator.clipboard.writeText(texto); if (toastEl) toastEl.textContent = "Copiado."; }
  catch(e){
    if (alvoSel){ const r = document.createRange(); r.selectNodeContents(alvoSel); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    if (toastEl) toastEl.textContent = "Texto selecionado: use Copiar do seu aparelho.";
  }
}
function pontos(n){ let h = '<div class="dots" aria-hidden="true">'; for (let i=0;i<100;i++) h += `<i${i<n?' class="on"':''}></i>`; return h + '</div>'; }
function draftBanner(){
  if (!CONFIG.rascunho) return "";
  return `<div class="draft" role="note"><b>Rascunho para validação.</b> Conteúdo ainda não revisado pelo comitê nem testado com pacientes. Não usar no atendimento.${WHATSAPP_EXEMPLO ? " O número de WhatsApp é um exemplo." : ""}</div>`;
}
function qr(el, text){
  el.innerHTML = "";
  if (typeof QRCode === "undefined"){ el.innerHTML = '<span class="small" style="color:#13232B">QR indisponível. Use o link abaixo.</span>'; return; }
  new QRCode(el, {text, width:168, height:168, colorDark:"#13232B", colorLight:"#FFFFFF", correctLevel:QRCode.CorrectLevel.M});
}

function resultadoTriagem(d){
  const nivel = nivelRisco(d.trat);
  const notas = [];
  notas.push("A diretriz ASCO 2025 recomenda conversar sobre fertilidade no diagnóstico e encaminhar quem tiver interesse ou estiver indeciso, qualquer que seja o risco.");
  if (d.urg === "1" || d.urg === "2") notas.push("Prazo curto: oriente o contato com o serviço hoje. Uma coleta pode ser feita em poucos dias.");
  if (d.urg === "0") notas.push("O ideal é coletar antes da primeira dose. Mesmo com o tratamento iniciado, vale conversar com o andrologista.");
  if (d.trat.includes("orq")) notas.push("Se o espermograma mostrar ausência de espermatozoides, a extração testicular pode ser feita no mesmo ato da orquiectomia (onco-TESE).");
  if (d.trat.includes("cir")) notas.push("Cirurgia pélvica ou retroperitoneal pode afetar a ejaculação mesmo sem quimioterapia.");
  if (d.pub === "n") notas.push("Pré-púbere: a PDA não se aplica. Encaminhe para discussão com especialista; a criopreservação de tecido testicular ainda é experimental.");
  if (d.pub === "x") notas.push("Puberdade incerta: o serviço pode avaliar se a coleta de sêmen é possível.");
  if (d.int === "n") notas.push("O paciente pode mudar de ideia. Entregue o código mesmo assim; ele decide se usa.");

  const code = codificar(d);
  const lp = linkPaciente(code);
  const prontuario = `Paciente orientado sobre risco de infertilidade relacionado ao tratamento oncológico (${nivel[1].toLowerCase()}) e sobre opções de preservação da fertilidade, com apoio do guia Decidir Antes v${CONFIG.versao}. Código de encaminhamento entregue: ${code}.`;
  return `<section class="panel" aria-labelledby="res-h">
    <div class="risk"><h2 id="res-h">Resultado</h2><span class="pill ${nivel[0]}">${nivel[1]}</span></div>
    <ul class="notes">${notas.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
    <div class="straw">
      <div class="qr" id="qr" role="img" aria-label="QR code do guia para o paciente"></div>
      <div class="stack">
        <span class="strawmeta">CÓDIGO DE ENCAMINHAMENTO · SEM IDENTIFICAÇÃO</span>
        <span class="code" id="code">${code}</span>
        <p class="small">O código e o QR levam as respostas desta triagem, sem nome nem contato. O paciente lê o guia e, se quiser, envia o código pelo WhatsApp; o serviço lê as respostas no próprio código.</p>
      </div>
    </div>
    <details class="small"><summary>O que este código informa ao serviço</summary>${tabelaResumo(resumoCodigo(decodificar(code)))}</details>
    <div class="btns">
      <a class="btn" href="#pda-${code}">Mostrar o guia ao paciente agora</a>
      <button class="btn ghost" type="button" id="cp-link">Copiar link para enviar</button>
    </div>
    <div class="copybox" id="link-box">${esc(lp)}</div>
    <p class="toast" id="t-link"></p>
    <div class="stack">
      <h3>Texto para o prontuário</h3>
      <div class="copybox" id="pront-box">${esc(prontuario)}</div>
      <div class="btns"><button class="btn ghost" type="button" id="cp-pront">Copiar texto</button></div>
      <p class="toast" id="t-pront"></p>
    </div>
    <div class="btns"><a class="btn ghost" href="#triagem" id="nova">Nova triagem</a></div>
  </section>`;
}

    ${["Por que agora","As opções","Os números","O que pesa para você","Você está pronto?","Próximos passos"].map((t,i) => `<button type="button" data-go="p${i+1}">${i+1}. ${t}</button>`).join("")}

    <p>O risco depende principalmente do tipo de tratamento. É maior com alguns quimioterápicos (os chamados alquilantes), radioterapia perto dos testículos e transplante de medula.</p>

  ${sec("p2",2,"As duas opções, lado a lado", `

    <div class="tablewrap"><table>
      <thead><tr><th scope="col">Aspecto</th><th scope="col">Congelar sêmen agora</th><th scope="col">Não congelar agora</th></tr></thead>
      <tbody>

  ${sec("p3",3,"Os números", `

  const nivel = r.int === "p" ? null : nivelRisco(r.trat);
  return `<section class="panel" aria-labelledby="ler-h">
    <div class="risk"><h2 id="ler-h"><span class="code" style="font-size:1.2rem">${esc(r.codigo)}</span></h2>${nivel ? `<span class="pill ${nivel[0]}">${nivel[1]}</span>` : ""}</div>
    ${tabelaResumo(resumoCodigo(r))}
    ${r.urg === "1" || r.urg === "2" ? `<p class="err">Prazo curto: priorize o agendamento da coleta.</p>` : ""}
    <p class="small muted">O código não contém nome nem contato. A identificação acontece só se o paciente se apresentar na conversa.</p>
  </section>`;
}

/* ===================== Roteamento e eventos ===================== */
const app = $("#app");
function rota(){
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^pda-(OF-[0-9A-Z]{3}-[0-9A-Z]{3}-[0-9A-Z]{3})$/);
  const l = h.match(/^ler(?:-(OF-[0-9A-Z]{3}-[0-9A-Z]{3}-[0-9A-Z]{3}))?$/);
  let modo = "inicio";
  if (h === "triagem"){ app.innerHTML = telaTriagem(); ligarTriagem(); modo = "triagem"; }
  else if (h === "pda" || m){ app.innerHTML = telaPDA(m ? m[1] : null); ligarPDA(); modo = "pda"; }
  else if (l){ app.innerHTML = telaLer(l[1]); ligarLer(!!l[1]); modo = "ler"; }
  else { app.innerHTML = telaInicio(); }
  document.querySelectorAll(".modes a").forEach(a => { if (a.dataset.mode === modo) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}

function ligarTriagem(){
  const f = $("#f-tri");
  f.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(f);
    const d = {pub:fd.get("pub"), trat:fd.getAll("trat"), urg:fd.get("urg"), int:fd.get("int")};
    const err = $("#tri-err");
    const falta = [];
    if (!d.pub) falta.push("puberdade"); if (!d.trat.length) falta.push("tratamento"); if (!d.urg) falta.push("início do tratamento"); if (!d.int) falta.push("interesse do paciente");
    if (falta.length){ err.textContent = `Responda: ${falta.join(", ")}.`; err.hidden = false; return; }
    err.hidden = true;
    const box = $("#tri-res");
    box.innerHTML = resultadoTriagem(d);
    const code = $("#code").textContent;
    qr($("#qr"), linkPaciente(code));
    $("#cp-link").addEventListener("click", () => copiar($("#link-box").textContent, $("#t-link"), $("#link-box")));
    $("#cp-pront").addEventListener("click", () => copiar($("#pront-box").textContent, $("#t-pront"), $("#pront-box")));
    $("#nova").addEventListener("click", e2 => { e2.preventDefault(); rota(); });
    box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  });
}

function ligarPDA(){
  document.querySelectorAll(".toc button").forEach(b => b.addEventListener("click", () => {
    $("#" + b.dataset.go).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));
  const sum = $("#vals-sum");
  const atualizar = () => {
    const alto = [...document.querySelectorAll("#vals input[type=range]")].filter(r => +r.value >= 3).map(r => r.dataset.t);
    sum.textContent = alto.length ? alto.join(" · ") : "Nenhum item marcado como muito importante ainda.";
  };
  document.querySelectorAll("#vals input[type=range]").forEach(r => r.addEventListener("input", atualizar));
  const sureRes = $("#sure-res");
  $("#sure").addEventListener("change", () => {
    const v = ["s1","s2","s3","s4"].map(n => (document.querySelector(`input[name=${n}]:checked`)||{}).value);
    if (v.some(x => !x)) { sureRes.textContent = "Responda as quatro perguntas."; return; }
    sureRes.textContent = v.includes("n")
      ? "Pelo menos uma resposta foi \"não\". Isso é comum. Leve as perguntas do próximo passo para conversar com a sua equipe."
      : "Você parece pronto para decidir. Mesmo assim, confirme a sua escolha com a sua equipe.";
  });
  const cp = $("#cp-msg");
  if (cp) cp.addEventListener("click", () => copiar($("#msg-box").textContent, $("#t-msg"), $("#msg-box")));
  const gen = $("#gen-code");
  if (gen) gen.addEventListener("click", () => {
    location.hash = "pda-" + codificar({pub:"x", trat:[], urg:"?", int:"p"});
    setTimeout(() => $("#enc").scrollIntoView(), 50);
  });
}

function ligarLer(auto){
  const f = $("#f-ler"), err = $("#ler-err"), res = $("#ler-res");
  const ler = () => {
    const r = decodificar($("#cod-in").value);
    if (r.erro){ err.textContent = r.erro; err.hidden = false; res.innerHTML = ""; return; }
    err.hidden = true; $("#cod-in").value = r.codigo; res.innerHTML = resultadoLer(r);
  };
  f.addEventListener("submit", e => { e.preventDefault(); ler(); });
  if (auto) ler();
}

window.addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
