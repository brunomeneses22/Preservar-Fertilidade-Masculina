<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Decidir Antes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: coluna única de leitura (~720px), barra fixa no topo; dois modos (profissional, paciente) roteados por #hash. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#13232B; --muted:#56676F; --line:#D6DFE3;
  --accent:#0E6A87; --accent-ink:#FFFFFF; --accent-soft:#E0EFF4;
  --warn:#9A5700; --warn-soft:#FCF1DF; --crit:#A8261D; --good:#2D7A4E;
  --dot-off:#D3DDE1;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D161B; --surface:#14212A; --ink:#E5EDF0; --muted:#9BB0B8; --line:#273843;
  --accent:#5DB6D3; --accent-ink:#06222C; --accent-soft:#123241;
  --warn:#E7AE5C; --warn-soft:#33260F; --crit:#F08C82; --good:#6CC495; --dot-off:#2A3B45; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#14212A; --ink:#E5EDF0; --muted:#9BB0B8; --line:#273843;
  --accent:#5DB6D3; --accent-ink:#06222C; --accent-soft:#123241;
  --warn:#E7AE5C; --warn-soft:#33260F; --crit:#F08C82; --good:#6CC495; --dot-off:#2A3B45; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.12rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:1.15rem}
.brand span{font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.brand span{display:none}.modes a{padding:6px 8px}}
.dl{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;margin:10px 0 0}
.dl dt{color:var(--muted);font-size:.85rem}
.dl dd{margin:0;min-width:0}
@media (max-width:420px){.dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}}
details summary{cursor:pointer;color:var(--accent);font-weight:700}
.cod-in{font:inherit;font-family:var(--f-mono);font-size:1.25rem;letter-spacing:.06em;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;max-width:22ch;text-transform:uppercase}
.modes{display:flex;gap:6px}
.modes a{font-size:.85rem;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px solid transparent}
.modes a[aria-current="page"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px;display:grid;gap:28px}
.draft{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.draft b{color:var(--warn)}
.lead{font-size:1.1rem;color:var(--muted);max-width:62ch}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:grid;gap:12px}
.stack-lg{display:grid;gap:20px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.choice{display:grid;gap:8px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink)}
.choice:hover{border-color:var(--accent)}
.choice h2{font-size:1.25rem}
.choice .go{color:var(--accent);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
legend{font-weight:700;margin-bottom:6px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt small{display:block;color:var(--muted);font-size:.85rem}
.row-opts{display:flex;flex-wrap:wrap;gap:8px}
.row-opts .opt{flex:1 1 140px}

.btn{font:inherit;font-weight:700;border-radius:8px;padding:11px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.err{color:var(--crit);font-size:.9rem}

.risk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid currentColor}
.pill.alto{color:var(--crit)} .pill.inter{color:var(--warn)} .pill.baixo{color:var(--good)} .pill.incerto{color:var(--muted)}
.notes{margin:0;padding-left:20px;display:grid;gap:6px}

/* Código como etiqueta de palheta de criopreservação */
.straw{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border:2px dashed var(--accent);border-radius:var(--r);padding:16px;background:var(--accent-soft)}
.straw .qr{background:#fff;padding:8px;border-radius:6px;width:184px;height:184px;display:grid;place-items:center}
.straw .qr img,.straw .qr canvas{display:block}
.code{font-family:var(--f-mono);font-size:clamp(1.5rem,6vw,2rem);letter-spacing:.06em;color:var(--ink)}
.strawmeta{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);letter-spacing:.04em}
@media (max-width:520px){.straw{grid-template-columns:1fr;justify-items:start}}

.copybox{font-family:var(--f-mono);font-size:.85rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;user-select:all}
.toast{font-size:.85rem;color:var(--good);min-height:1.2em}

/* PDA */
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc button{font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
section.step{display:grid;gap:14px;scroll-margin-top:72px}
.stepno{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);letter-spacing:.06em}
.callout{border-left:4px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
thead th{font-family:var(--f-display);font-size:1rem;background:var(--accent-soft)}
tbody th{font-weight:700;color:var(--muted);width:22%;font-size:.88rem}
tr:last-child th,tr:last-child td{border-bottom:0}
.todo{color:var(--warn);font-style:italic}

.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.fig{display:grid;gap:12px;align-content:start}
.fig h3{font-size:1.05rem}
.stat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.dots{display:grid;grid-template-columns:repeat(10,10px);gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--dot-off)}
.dots i.on{background:var(--accent)}
.stat p{font-size:.95rem}
.stat strong{font-variant-numeric:tabular-nums}
.src{font-size:.78rem;color:var(--muted)}

.vals{display:grid;gap:14px}
.val{display:grid;gap:6px}
.val label{font-weight:700}
.val input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:5px;accent-color:var(--accent);flex:none}
.sure{display:grid;gap:8px}
.sure .q{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sure .q span{flex:1 1 280px}
.yn{display:flex;gap:6px}
.yn label{border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.9rem}
.yn label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.yn input{position:absolute;opacity:0;pointer-events:none}
.refs{margin:0;padding-left:22px;display:grid;gap:6px;font-size:.88rem}
footer{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<style>
/* Base que a plataforma de artifacts adicionava automaticamente */
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
</style>

<header class="topbar"><div class="in">

<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* qrcode-generator 1.4.4, (c) 2009 Kazuhiko Arase, licença MIT. Incluída aqui para o app não depender de CDN. */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===================== Códigos de encaminhamento (stateless) =====================
   Nada é guardado em servidor: as respostas viajam dentro do próprio código, no link e no QR.
   Base32 de Crockford + 1 caractere de conferência (soma ponderada mod 31).
   · Código da triagem: 9 caracteres (OF-XXX-XXX-XXX). Gerado pelo profissional.
   · Código completo: 16 caracteres (OF-XXXX-XXXX-XXXX-XXXX). Gerado pelo paciente no fim do guia.
   ESTRUTURA FIXA (nunca mudar): o número codificado termina na VERSÃO DO QUESTIONÁRIO, nos 6 bits
   menos significativos (base 64). O decodificador lê a versão primeiro e só então usa as listas
   daquela versão para ler o resto. Os demais campos, do mais para o menos significativo:
     triagem: puberdade · tratamentos (1 bit por opção) · início · interesse · dia da triagem
              (ciclo de 1024 dias desde 01/01/2026) · aleatório (256)
     completo: os da triagem + dias até o preenchimento (0 a 63) · um nível por valor · inclinação
              · uma resposta por pergunta SURE · perguntas marcadas (1 bit por pergunta)
   É codificação, não criptografia: quem tem o link lê as respostas, que não identificam o paciente. */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const BASE_VERSAO = 64;
const TAM_TRIAGEM = 9, TAM_COMPLETO = 16;
const DIA0 = Date.UTC(2026, 0, 1);
const basesTriagem = q => [q.pub.length, 2 ** q.trat.length, q.urg.length, q.int.length, 1024, 256];
const basesPaciente = q => [64, ...q.valores.map(() => q.niveis.length), q.lean.length, ...q.sure.map(() => q.yn.length), 2 ** q.perguntas.length];
const produto = bs => bs.reduce((p, b) => p * BigInt(b), 1n);
/* Confere, ao carregar, se toda versão cabe nos tamanhos fixos do código */
for (const [v, q] of Object.entries(QUESTIONARIOS)){
  if (+v < 1 || +v >= BASE_VERSAO) throw new Error(`Versão de questionário ${v} fora do intervalo 1 a ${BASE_VERSAO - 1}.`);
  if (produto(basesTriagem(q)) * BigInt(BASE_VERSAO) > 32n ** BigInt(TAM_TRIAGEM - 1)) throw new Error(`Questionário v${v}: a triagem não cabe em ${TAM_TRIAGEM} caracteres.`);
  if (produto([...basesTriagem(q), ...basesPaciente(q)]) * BigInt(BASE_VERSAO) > 32n ** BigInt(TAM_COMPLETO - 1)) throw new Error(`Questionário v${v}: o código completo não cabe em ${TAM_COMPLETO} caracteres.`);
}

function diaHoje(){ const n = new Date(); return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - DIA0) / 864e5); }
function conferencia(vals){ return vals.reduce((s, v, i) => s + v * (i + 1), 0) % 31; }
const formatar = (vals, tam) => { const c = vals.map(v => B32[v]).join(""); return "OF-" + c.match(new RegExp(`.{1,${tam === TAM_TRIAGEM ? 3 : 4}}`, "g")).join("-"); };
const idx = (lista, id) => lista.findIndex(o => o.id === id);
function empacotar(campos, bases, versao, tam){
  let x = 0n;
  campos.forEach((v, i) => {
    if (!(Number.isInteger(v) && v >= 0 && v < bases[i])) throw new Error("Resposta fora do esperado ao gerar o código.");
    x = x * BigInt(bases[i]) + BigInt(v);
  });
  x = x * BigInt(BASE_VERSAO) + BigInt(versao);          // versão sempre nos bits menos significativos
  const vals = []; for (let i = 0; i < tam - 1; i++){ vals.unshift(Number(x % 32n)); x /= 32n; }
  if (x !== 0n) throw new Error("O código não coube no tamanho previsto.");
  vals.push(conferencia(vals));
  return formatar(vals, tam);
}
function camposTriagem(q, d, dia, aleat){
  return [idx(q.pub, d.pub), q.trat.reduce((m, o, i) => m + (d.trat.includes(o.id) ? 2 ** i : 0), 0), idx(q.urg, d.urg), idx(q.int, d.int), dia, aleat];
}
function codificarTriagem(d){
  const aleat = crypto.getRandomValues(new Uint32Array(1))[0] % 256;
  return empacotar(camposTriagem(Q, d, ((diaHoje() % 1024) + 1024) % 1024, aleat), basesTriagem(Q), Q_ATUAL, TAM_TRIAGEM);
}
/* tri = decodificar() de um código de triagem; pac = respostas do paciente.
   O código completo usa a MESMA versão do código de triagem recebido. Se a triagem foi feita numa
   versão antiga, o paciente responde com as perguntas da versão atual; nesse caso a triagem é
   recodificada na versão atual, desde que todas as respostas dela existam nessa versão. */
function codificarCompleto(tri, pac){
  const q = Q, v = Q_ATUAL;
  const dpac = Math.min(63, Math.max(0, diaHoje() - Math.round((tri.data.getTime() - DIA0) / 864e5)));
  const t = camposTriagem(q, tri, tri.bruto.dia, tri.bruto.aleat);
  if (t.some(x => x < 0)) throw new Error("A triagem recebida usa opções que não existem na versão atual do questionário.");
  const perg = pac.perg.reduce((m, x, i) => m + (x ? 2 ** i : 0), 0);
  const campos = [...t, dpac, ...pac.vals, idx(q.lean, pac.lean), ...pac.sure.map(x => idx(q.yn, x)), perg];
  return empacotar(campos, [...basesTriagem(q), ...basesPaciente(q)], v, TAM_COMPLETO);
}
function decodificar(bruto){
  let s = String(bruto || "").toUpperCase().replace(/[^0-9A-Z]/g, "");
  if (s.startsWith("OF")) s = s.slice(2);
  s = s.replace(/O/g, "0").replace(/[IL]/g, "1");
  if (s.length !== TAM_TRIAGEM && s.length !== TAM_COMPLETO) return {erro: "O código tem 9 ou 16 caracteres depois de OF, por exemplo OF-1A2-B3C-D4E."};
  const vals = [...s].map(ch => B32.indexOf(ch));
  if (vals.some(v => v < 0)) return {erro: "O código tem um caractere que não existe neste formato. Confira se foi copiado sem erros."};
  if (conferencia(vals.slice(0, -1)) !== vals.at(-1)) return {erro: "O código não confere. Provavelmente um caractere foi digitado ou copiado errado."};
  let x = 0n; vals.slice(0, -1).forEach(v => { x = x * 32n + BigInt(v); });
  const versao = Number(x % BigInt(BASE_VERSAO)); x /= BigInt(BASE_VERSAO);
  const q = QUESTIONARIOS[versao];
  if (!q) return {erro: `Este código usa a versão ${versao} do questionário, que este app não conhece. Abra a versão mais recente do app.`};
  const completo = s.length === TAM_COMPLETO;
  const bases = completo ? [...basesTriagem(q), ...basesPaciente(q)] : basesTriagem(q);
  const out = []; for (let i = bases.length - 1; i >= 0; i--){ const b = BigInt(bases[i]); out.unshift(Number(x % b)); x /= b; }
  if (x !== 0n) return {erro: "O código não confere. Provavelmente um caractere foi digitado ou copiado errado."};
  const [pub, mask, urg, int, dia, aleat] = out;
  const hoje = diaHoje(), k = hoje - (((hoje - dia) % 1024) + 1024) % 1024;
  const r = {
    codigo: formatar(vals, s.length), completo, versao, q, bruto: {dia, aleat},
    pub: q.pub[pub].id, trat: q.trat.filter((o, i) => mask & (1 << i)).map(o => o.id),
    urg: q.urg[urg].id, int: q.int[int].id, data: new Date(DIA0 + k * 864e5)
  };
  if (completo){
    const p = out.slice(6), nv = q.valores.length, ns = q.sure.length;
    r.pac = {
      dpac: p[0], dataPac: new Date(r.data.getTime() + p[0] * 864e5),
      vals: p.slice(1, 1 + nv), lean: q.lean[p[1 + nv]].id,
      sure: p.slice(2 + nv, 2 + nv + ns).map(v => q.yn[v].id),
      perg: q.perguntas.map((t, i) => !!(p[2 + nv + ns] & (1 << i)))
    };
  }
  return r;
}
function nivelRisco(trat, q = Q){
  const sel = q.trat.filter(o => trat.includes(o.id));
  const max = sel.length ? Math.max(...sel.map(o => o.nivel)) : -1;
  return max >= 3 ? ["alto","Risco alto"] : max === 2 ? ["inter","Risco intermediário"] : max === 1 ? ["baixo","Risco baixo a intermediário"] : ["incerto","Risco incerto"];
}
const dataFmt = (dt, dias = 0) => { const x = new Date(dt.getTime() + dias * 864e5); return `${String(x.getUTCDate()).padStart(2,"0")}/${String(x.getUTCMonth()+1).padStart(2,"0")}/${x.getUTCFullYear()}`; };
const opc = (lista, id) => lista.find(o => o.id === id) || {t: "Não informado"};
const versaoTxt = r => `Versão ${r.versao} do questionário (${r.q.data})`;
function resumoCodigo(r){
  const q = r.q;
  if (r.int === "p") return [["Triagem", "Sem triagem profissional (guia aberto diretamente pelo paciente)"], ["Questionário", versaoTxt(r)]];

  if (sure.some(v => !v)) return "Não respondeu todas as perguntas";

/* valor de texto é escapado; valor {html} já vem montado e escapado por listaHtml */
const tabelaResumo = linhas => `<dl class="dl">${linhas.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${typeof v === "object" ? v.html : esc(v)}</dd>`).join("")}</dl>`;

function blocoRespostas(r){
  const nivel = r.int === "p" ? null : nivelRisco(r.trat, r.q);
  return `<section class="panel" aria-labelledby="res-cod">
      <div class="risk"><h2 id="res-cod"><span class="code" style="font-size:1.05rem">${esc(r.codigo)}</span></h2>${nivel ? `<span class="pill ${nivel[0]}">${nivel[1]}</span>` : ""}</div>
      <h3>Triagem da equipe de saúde</h3>
      ${tabelaResumo(resumoCodigo(r))}
      ${r.urg === "1" || r.urg === "2" ? `<p class="err">Prazo curto: priorize o agendamento da coleta.</p>` : ""}

    </section>`;
}

/* Autoteste: no console do navegador, rode testarCodigos(). Deve terminar com "falhas: 0". */
function testarCodigos(n = 3000){
  let falhas = 0;
  const rnd = k => Math.floor(Math.random() * k), pick = l => l[rnd(l.length)].id;
  for (let i = 0; i < n; i++){
    const d = {pub: pick(Q.pub), trat: Q.trat.filter(() => Math.random() < .3).map(o => o.id), urg: pick(Q.urg), int: pick(Q.int)};
    const pac = {vals: Q.valores.map(() => rnd(Q.niveis.length)), lean: pick(Q.lean), sure: Q.sure.map(() => pick(Q.yn)), perg: Q.perguntas.map(() => Math.random() < .5)};
    const t = decodificar(codificarTriagem(d)), c = decodificar(codificarCompleto(t, pac));
    const ok = [t, c].every(r => !r.erro && r.versao === Q_ATUAL && r.pub === d.pub && r.urg === d.urg && r.int === d.int && r.trat.join() === d.trat.join())
      && c.pac.vals.join() === pac.vals.join() && c.pac.lean === pac.lean && c.pac.sure.join() === pac.sure.join() && c.pac.perg.join() === pac.perg.join();
    if (!ok) falhas++;
  }
  console.log(`testarCodigos: ${n} casos, falhas: ${falhas}`);
  return falhas;
}

function pontos(n){ let h = '<div class="dots" aria-hidden="true">'; for (let i=0;i<100;i++) h += `<i${i<n?' class="on"':''}></i>`; return h + '</div>'; }
function draftBanner(){
  if (!CONFIG.rascunho) return "";
  return `<div class="draft" role="note"><b>Rascunho para validação.</b> Conteúdo ainda não revisado pelo comitê nem testado com pacientes. Não usar no atendimento.${WHATSAPP_EXEMPLO ? " O número de WhatsApp é um exemplo." : ""}</div>`;
}
function qr(el, text){
  el.innerHTML = "";
  try {
    const q = qrcode(0, "M");            // versão automática, correção de erro M (15%)
    q.addData(text); q.make();
    el.innerHTML = q.createSvgTag({cellSize: 4, margin: 2, scalable: true});
    const svg = el.querySelector("svg"); svg.setAttribute("width", "168"); svg.setAttribute("height", "168");
  } catch (e){ el.innerHTML = '<span class="small" style="color:#13232B">Não foi possível gerar o QR. Use o link abaixo.</span>'; }
}

function resultadoTriagem(d){
  const nivel = nivelRisco(d.trat);
  const notas = [];
  notas.push("A diretriz ASCO 2025 recomenda conversar sobre fertilidade no diagnóstico e encaminhar quem tiver interesse ou estiver indeciso, qualquer que seja o risco.");
  if (d.urg === "1" || d.urg === "2") notas.push("Prazo curto: oriente o contato com o serviço hoje. Uma coleta pode ser feita em poucos dias.");
  if (d.urg === "0") notas.push("O ideal é coletar antes da primeira dose. Mesmo com o tratamento iniciado, vale conversar com o andrologista.");
  if (d.trat.includes("orq")) notas.push("Se o espermograma mostrar ausência de espermatozoides, a extração testicular pode ser feita no mesmo ato da orquiectomia (onco-TESE).");
  if (d.trat.includes("cir")) notas.push("Cirurgia pélvica ou retroperitoneal pode afetar a ejaculação mesmo sem quimioterapia.");
  if (d.pub === "n") notas.push("Pré-púbere: a PDA não se aplica. Encaminhe para discussão com especialista; a criopreservação de tecido testicular ainda é experimental.");
  if (d.pub === "x") notas.push("Puberdade incerta: o serviço pode avaliar se a coleta de sêmen é possível.");
  if (d.int === "n") notas.push("O paciente pode mudar de ideia. Entregue o código mesmo assim; ele decide se usa.");

  const code = codificarTriagem(d);
  const lp = linkPaciente(code);
  const prontuario = `Paciente orientado sobre risco de infertilidade relacionado ao tratamento oncológico (${nivel[1].toLowerCase()}) e sobre opções de preservação da fertilidade, com apoio do guia Decidir Antes v${CONFIG.versao}. Código de encaminhamento entregue: ${code}.`;
  return `<section class="panel" aria-labelledby="res-h">

    <p class="toast" id="t-link"></p>
    <div class="stack">
      <h3>Texto para o prontuário</h3>
      <div class="copybox" id="pront-box">${esc(prontuario)}</div>

const app = $("#app");
let pdaTriagem = null;   // código de triagem recebido no link do paciente
function rota(){
  const h = location.hash.replace(/^#/, "");
  const m = h.match(/^(pda|ver|ler)(?:-(OF[0-9A-Z-]+))?$/);
  let modo = "inicio";
  if (h === "triagem"){ app.innerHTML = telaTriagem(); ligarTriagem(); modo = "triagem"; }
  else if (m && m[1] === "pda"){ pdaTriagem = m[2] || null; app.innerHTML = telaPDA(pdaTriagem); ligarPDA(); modo = "pda"; }
  else if (m && m[1] === "ver" && m[2]){ app.innerHTML = telaVer(m[2]); ligarVer(); modo = "ler"; }
  else if (m && m[1] === "ler"){ app.innerHTML = telaLer(m[2]); ligarLer(!!m[2]); modo = "ler"; }
  else { app.innerHTML = telaInicio(); }
  document.querySelectorAll(".modes a").forEach(a => { if (a.dataset.mode === modo) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0,0);
}

function ligarTriagem(){
  const f = $("#f-tri");
  f.addEventListener("submit", e => {
    e.preventDefault();
    const fd = new FormData(f);
    const d = {pub:fd.get("pub"), trat:fd.getAll("trat"), urg:fd.get("urg"), int:fd.get("int")};
    const err = $("#tri-err");
    const falta = [];
    if (!d.pub) falta.push("puberdade"); if (!d.trat.length) falta.push("tratamento"); if (!d.urg) falta.push("início do tratamento"); if (!d.int) falta.push("interesse do paciente");
    if (falta.length){ err.textContent = `Responda: ${falta.join(", ")}.`; err.hidden = false; return; }
    err.hidden = true;
    const box = $("#tri-res");
    box.innerHTML = resultadoTriagem(d);
    const code = $("#code").textContent;
    qr($("#qr"), linkPaciente(code));
    $("#cp-link").addEventListener("click", () => copiar($("#link-box").textContent, $("#t-link"), $("#link-box")));
    $("#cp-pront").addEventListener("click", () => copiar($("#pront-box").textContent, $("#t-pront"), $("#pront-box")));
    $("#nova").addEventListener("click", e2 => { e2.preventDefault(); rota(); });
    box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  });
}

function ligarPDA(){
  document.querySelectorAll(".toc button").forEach(b => b.addEventListener("click", () => {
    $("#" + b.dataset.go).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));
  const sum = $("#vals-sum");
  const atualizar = () => {
    const alto = [...document.querySelectorAll("#vals input[type=range]")].filter(r => +r.value >= 3).map(r => r.dataset.t);
    sum.textContent = alto.length ? alto.join(" · ") : "Nenhum item marcado como muito importante ainda.";
  };
  document.querySelectorAll("#vals input[type=range]").forEach(r => r.addEventListener("input", atualizar));
  const sureRes = $("#sure-res");
  $("#sure").addEventListener("change", () => {
    const v = ["s1","s2","s3","s4"].map(n => (document.querySelector(`input[name=${n}]:checked`)||{}).value);
    if (v.some(x => !x)) { sureRes.textContent = "Responda as quatro perguntas."; return; }
    sureRes.textContent = v.includes("n")
      ? "Pelo menos uma resposta foi \"não\". Isso é comum. Leve as perguntas do próximo passo para conversar com a sua equipe."
      : "Você parece pronto para decidir. Mesmo assim, confirme a sua escolha com a sua equipe.";
  });
  $("#gerar").addEventListener("click", gerarResumo);
}

/* Lê o que o paciente marcou e gera o código completo (triagem + respostas) */
function respostasPaciente(){
  const marcado = n => (document.querySelector(`input[name=${n}]:checked`) || {}).value || "";
  return {
    vals: VALORES.map((t, i) => +$(`#v${i+1}`).value),
    lean: marcado("lean"),
    sure: SURE_Q.map((q, i) => marcado(`s${i+1}`)),
    perg: PERGUNTAS.map((q, i) => $(`#q${i}`).checked)
  };
}
function gerarResumo(){
  let tri = pdaTriagem ? decodificar(pdaTriagem) : null;
  if (!tri || tri.erro || tri.completo) tri = decodificar(codificarTriagem({pub:"x", trat:[], urg:"?", int:"p"}));
  const code = codificarCompleto(tri, respostasPaciente());
  const w = linkWhats(code), link = linkVer(code);
  const box = $("#final");
  box.innerHTML = `
    <div class="straw">
      <div class="qr" id="qr-final" role="img" aria-label="QR code com o seu resumo"></div>
      <div class="stack">
        <span class="strawmeta">SEU RESUMO · SEM IDENTIFICAÇÃO</span>
        <span class="code" style="font-size:clamp(1rem,4.5vw,1.4rem)">${esc(code)}</span>
        <p class="small">O link e o QR levam todas as respostas, sem nome nem contato. Se mudar alguma resposta acima, gere o resumo de novo.</p>
      </div>
    </div>
    <div class="btns">
      <a class="btn" href="${w.url}" target="_blank" rel="noopener">Abrir no WhatsApp</a>
      <button class="btn ghost" type="button" id="cp-final">Copiar link</button>
      <a class="btn ghost" href="#ver-${code}">Ver o resumo</a>
    </div>
    <div class="copybox" id="final-box">${esc(link)}</div>
    <p class="small">A mensagem vai para o número do serviço: <span class="copybox" style="display:inline-block;padding:2px 8px">${numeroFmt(CONFIG.whatsapp)}</span></p>
    <p class="toast" id="t-final"></p>`;
  qr($("#qr-final"), link);
  $("#cp-final").addEventListener("click", () => copiar(link, $("#t-final"), $("#final-box")));
  box.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest"});
}

function ligarVer(){
  const b = $("#cp-ver");
  if (b) b.addEventListener("click", () => copiar($("#ver-box").textContent, $("#t-ver"), $("#ver-box")));
}

function ligarLer(auto){
  const f = $("#f-ler"), err = $("#ler-err"), res = $("#ler-res");
  const ler = () => {
    const r = decodificar($("#cod-in").value);
    if (r.erro){ err.textContent = r.erro; err.hidden = false; res.innerHTML = ""; return; }
    err.hidden = true; $("#cod-in").value = r.codigo; res.innerHTML = blocoRespostas(r);
  };
  f.addEventListener("submit", e => { e.preventDefault(); ler(); });
  if (auto) ler();
}

window.addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
